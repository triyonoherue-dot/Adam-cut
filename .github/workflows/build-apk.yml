name: Build Adam Cut APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Buat seluruh struktur proyek Adam Cut
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/contoh/videoeditor/model
          mkdir -p app/src/main/java/com/contoh/videoeditor/engine
          mkdir -p app/src/main/java/com/contoh/videoeditor/ai
          mkdir -p app/src/main/java/com/contoh/videoeditor/viewmodel
          mkdir -p app/src/main/java/com/contoh/videoeditor/ui

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AdamCut"
          include(":app")
          EOF

          # 2. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.contoh.videoeditor"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.contoh.adamcut"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              val media3Version = "1.5.1"

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-transformer:$media3Version")
              implementation("androidx.media3:media3-effect:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")

              implementation("com.google.mlkit:translate:17.0.3")
              implementation("com.google.mlkit:segmentation-selfie:16.0.0-beta6")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:label="Adam Cut"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AdamCut">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AdamCut" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0E0E10</item>
                  <item name="android:navigationBarColor">#0E0E10</item>
              </style>
          </resources>
          EOF

          # 7. ProVideoModels.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/model/ProVideoModels.kt
          package com.contoh.videoeditor.model

          import android.graphics.Bitmap
          import android.graphics.Color
          import android.net.Uri

          enum class MaskShape { NONE, CIRCLE, RECTANGLE, BLUR_FACE }
          enum class VideoFilter { NONE, CINEMATIC, DARK, VINTAGE }
          enum class VideoEffectType { NONE, GLITCH, SHAKE, FLASH }
          enum class TransitionType { NONE, WHOOSH, GLITCH, ZOOM }
          enum class TextAnimation { NONE, POP, GLITCH, FADE }

          data class Keyframe(
              val timeMs: Long,
              val posX: Float = 0f,
              val posY: Float = 0f,
              val scale: Float = 1f
          )

          data class VideoClipItem(
              val uri: Uri,
              val startMs: Long = 0L,
              val endMs: Long = 6000L,
              val speed: Float = 1.0f,
              val isReversed: Boolean = false,
              val freezeAtMs: Long? = null,
              val maskShape: MaskShape = MaskShape.NONE,
              val autoCutoutBackground: Boolean = false,
              val blurBackground: Boolean = false,
              val filter: VideoFilter = VideoFilter.NONE,
              val effect: VideoEffectType = VideoEffectType.NONE,
              val transitionOut: TransitionType = TransitionType.NONE,
              val brightness: Float = 0f,
              val contrast: Float = 0f,
              val saturation: Float = 0f
          )

          data class AudioTrackItem(
              val uri: Uri,
              val volume: Float = 1.0f,
              val enableNoiseReduction: Boolean = false,
              val startOffsetMs: Long = 0L
          )

          data class StickerOverlayItem(
              val bitmap: Bitmap,
              val startMs: Long,
              val endMs: Long,
              val keyframes: List<Keyframe> = emptyList()
          )

          data class ProTextItem(
              val text: String,
              val startMs: Long,
              val endMs: Long,
              val textColor: Int = Color.YELLOW,
              val backgroundColor: Int = Color.parseColor("#80000000"),
              val animation: TextAnimation = TextAnimation.POP,
              val keyframes: List<Keyframe> = emptyList()
          )

          data class ExportPreset(
              val width: Int = 1080,
              val height: Int = 1920,
              val fps: Float = 30f,
              val enhanceSharpness: Boolean = false
          )

          data class ProEditProject(
              val mainClips: List<VideoClipItem> = emptyList(),
              val overlayClips: List<VideoClipItem> = emptyList(),
              val audioTracks: List<AudioTrackItem> = emptyList(),
              val textsAndCaptions: List<ProTextItem> = emptyList(),
              val stickers: List<StickerOverlayItem> = emptyList(),
              val exportPreset: ExportPreset = ExportPreset()
          )
          EOF

          # 8. ProEffectsBuilder.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/engine/ProEffectsBuilder.kt
          package com.contoh.videoeditor.engine

          import android.graphics.Typeface
          import android.text.Spannable
          import android.text.SpannableString
          import android.text.style.AbsoluteSizeSpan
          import android.text.style.BackgroundColorSpan
          import android.text.style.ForegroundColorSpan
          import android.text.style.StyleSpan
          import androidx.annotation.OptIn
          import androidx.media3.common.Effect
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.*
          import com.contoh.videoeditor.model.*

          @OptIn(UnstableApi::class)
          object ProEffectsBuilder {

              fun buildClipVideoEffects(
                  clip: VideoClipItem,
                  preset: ExportPreset
              ): List<Effect> {
                  val effects = mutableListOf<Effect>()

                  effects.add(
                      Presentation.createForWidthAndHeight(
                          preset.width,
                          preset.height,
                          Presentation.LAYOUT_SCALE_TO_FIT_WITH_CROP
                      )
                  )
                  effects.add(FrameDropEffect.createSimpleFrameDropEffect(preset.fps, preset.fps))

                  if (clip.speed != 1.0f) {
                      effects.add(SpeedChangeEffect(clip.speed))
                  }

                  if (clip.contrast != 0f) {
                      effects.add(Contrast(clip.contrast))
                  }
                  if (clip.brightness != 0f || clip.saturation != 0f) {
                      effects.add(
                          HslAdjustment.Builder()
                              .adjustLightness(clip.brightness * 100f)
                              .adjustSaturation(clip.saturation * 100f)
                              .build()
                      )
                  }

                  when (clip.filter) {
                      VideoFilter.CINEMATIC -> {
                          effects.add(Contrast(0.25f))
                          effects.add(
                              RgbAdjustment.Builder()
                                  .setRedScale(1.05f)
                                  .setGreenScale(1.0f)
                                  .setBlueScale(0.90f)
                                  .build()
                          )
                      }
                      VideoFilter.DARK -> {
                          effects.add(Contrast(0.35f))
                          effects.add(
                              HslAdjustment.Builder()
                                  .adjustLightness(-15f)
                                  .adjustSaturation(-20f)
                                  .build()
                          )
                      }
                      else -> {}
                  }

                  return effects
              }

              fun createAnimatedTextOverlay(item: ProTextItem): TextOverlay {
                  return object : TextOverlay() {
                      override fun getText(presentationTimeUs: Long): SpannableString {
                          val ms = presentationTimeUs / 1000L
                          if (ms !in item.startMs..item.endMs) return SpannableString("")

                          return SpannableString(item.text).apply {
                              setSpan(ForegroundColorSpan(item.textColor), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                              setSpan(BackgroundColorSpan(item.backgroundColor), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                              setSpan(StyleSpan(Typeface.BOLD), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                              setSpan(AbsoluteSizeSpan(54), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                          }
                      }

                      override fun getOverlaySettings(presentationTimeUs: Long): StaticOverlaySettings {
                          val ms = presentationTimeUs / 1000L
                          val elapsed = (ms - item.startMs).coerceAtLeast(0L)
                          val (posX, posY, baseScale) = interpolateKeyframes(item.keyframes, ms)

                          val animScale = when (item.animation) {
                              TextAnimation.POP -> if (elapsed < 150L) 0.5f + (elapsed / 150f) * 0.6f else 1.0f
                              else -> 1.0f
                          }
                          val glitchOffsetX = if (item.animation == TextAnimation.GLITCH && elapsed < 250L) {
                              if ((elapsed / 30L) % 2L == 0L) 0.04f else -0.04f
                          } else 0f

                          return StaticOverlaySettings.Builder()
                              .setBackgroundFrameAnchor(posX + glitchOffsetX, posY)
                              .setScale(baseScale * animScale, baseScale * animScale)
                              .build()
                      }
                  }
              }

              private fun interpolateKeyframes(keyframes: List<Keyframe>, currentMs: Long): Triple<Float, Float, Float> {
                  if (keyframes.isEmpty()) return Triple(0f, -0.65f, 1f)
                  if (keyframes.size == 1) return Triple(keyframes[0].posX, keyframes[0].posY, keyframes[0].scale)

                  val sorted = keyframes.sortedBy { it.timeMs }
                  val prev = sorted.lastOrNull { it.timeMs <= currentMs } ?: sorted.first()
                  val next = sorted.firstOrNull { it.timeMs >= currentMs } ?: sorted.last()

                  if (prev.timeMs == next.timeMs) return Triple(prev.posX, prev.posY, prev.scale)

                  val t = (currentMs - prev.timeMs).toFloat() / (next.timeMs - prev.timeMs).toFloat()
                  val x = prev.posX + (next.posX - prev.posX) * t
                  val y = prev.posY + (next.posY - prev.posY) * t
                  val s = prev.scale + (next.scale - prev.scale) * t
                  return Triple(x, y, s)
              }
          }
          EOF

          # 9. VideoEditorEngine.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/engine/VideoEditorEngine.kt
          package com.contoh.videoeditor.engine

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.annotation.OptIn
          import androidx.media3.common.Effect
          import androidx.media3.common.MediaItem
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.OverlayEffect
          import androidx.media3.effect.TextureOverlay
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.EditedMediaItemSequence
          import androidx.media3.transformer.Effects
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import com.contoh.videoeditor.model.ProEditProject
          import java.io.File

          @OptIn(UnstableApi::class)
          class VideoEditorEngine(private val context: Context) {

              fun exportProject(
                  project: ProEditProject,
                  onSuccess: (Uri) -> Unit,
                  onError: (Exception) -> Unit
              ) {
                  if (project.mainClips.isEmpty()) {
                      onError(IllegalStateException("Tambahkan minimal 1 video terlebih dahulu"))
                      return
                  }

                  val tempOutputFile = File(context.cacheDir, "adamcut_${System.currentTimeMillis()}.mp4")
                  val textOverlays: List<TextureOverlay> = project.textsAndCaptions.map {
                      ProEffectsBuilder.createAnimatedTextOverlay(it)
                  }

                  val editedVideoItems = project.mainClips.map { clip ->
                      val mediaItemBuilder = MediaItem.Builder().setUri(clip.uri)
                      if (clip.endMs > clip.startMs) {
                          mediaItemBuilder.setClippingConfiguration(
                              MediaItem.ClippingConfiguration.Builder()
                                  .setStartPositionMs(clip.startMs)
                                  .setEndPositionMs(clip.endMs)
                                  .build()
                          )
                      }
                      val clipEffects = mutableListOf<Effect>()
                      clipEffects.addAll(ProEffectsBuilder.buildClipVideoEffects(clip, project.exportPreset))
                      if (textOverlays.isNotEmpty()) {
                          clipEffects.add(OverlayEffect(textOverlays))
                      }

                      EditedMediaItem.Builder(mediaItemBuilder.build())
                          .setEffects(Effects(emptyList(), clipEffects))
                          .build()
                  }

                  val sequences = mutableListOf<EditedMediaItemSequence>()
                  sequences.add(EditedMediaItemSequence.Builder(editedVideoItems).build())

                  project.audioTracks.forEach { audio ->
                      val audioItem = EditedMediaItem.Builder(MediaItem.fromUri(audio.uri))
                          .setRemoveVideo(true)
                          .build()
                      sequences.add(EditedMediaItemSequence.Builder(listOf(audioItem)).build())
                  }

                  val composition = Composition.Builder(sequences).build()

                  val transformer = Transformer.Builder(context)
                      .addListener(object : Transformer.Listener {
                          override fun onCompleted(composition: Composition, exportResult: ExportResult) {
                              val savedUri = saveFileToGallery(tempOutputFile)
                              tempOutputFile.delete()
                              if (savedUri != null) onSuccess(savedUri)
                              else onError(Exception("Gagal menyimpan ke galeri"))
                          }

                          override fun onError(
                              composition: Composition,
                              exportResult: ExportResult,
                              exportException: ExportException
                          ) {
                              onError(exportException)
                          }
                      })
                      .build()

                  transformer.start(composition, tempOutputFile.absolutePath)
              }

              private fun saveFileToGallery(sourceFile: File): Uri? {
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, "AdamCut_${System.currentTimeMillis()}.mp4")
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/AdamCut")
                  }
                  val resolver = context.contentResolver
                  val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return null
                  resolver.openOutputStream(uri)?.use { out ->
                      sourceFile.inputStream().use { inp -> inp.copyTo(out) }
                  }
                  return uri
              }
          }
          EOF

          # 10. AudioAndAiHelper.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/ai/AudioAndAiHelper.kt
          package com.contoh.videoeditor.ai

          import android.content.Context
          import android.media.MediaRecorder
          import android.os.Build
          import android.speech.tts.TextToSpeech
          import java.io.File
          import java.util.Locale

          class AudioAndAiHelper(private val context: Context) {

              private var recorder: MediaRecorder? = null
              private var tts: TextToSpeech? = null

              fun startVoiceoverRecording(outputFile: File) {
                  recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      MediaRecorder(context)
                  } else {
                      @Suppress("DEPRECATION") MediaRecorder()
                  }.apply {
                      setAudioSource(MediaRecorder.AudioSource.VOICE_COMMUNICATION)
                      setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      setOutputFile(outputFile.absolutePath)
                      prepare()
                      start()
                  }
              }

              fun stopVoiceoverRecording() {
                  recorder?.apply {
                      stop()
                      release()
                  }
                  recorder = null
              }

              fun generateTtsAudioFile(
                  text: String,
                  outputFile: File,
                  isDeepMaleVoice: Boolean = true,
                  onDone: (File) -> Unit
              ) {
                  tts = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("id", "ID")
                          tts?.setPitch(if (isDeepMaleVoice) 0.75f else 1.0f)
                          tts?.setSpeechRate(0.95f)
                          tts?.synthesizeToFile(text, null, outputFile, "tts_clip_id")
                          onDone(outputFile)
                      }
                  }
              }
          }
          EOF

          # 11. EditorViewModel.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/viewmodel/EditorViewModel.kt
          package com.contoh.videoeditor.viewmodel

          import android.net.Uri
          import androidx.lifecycle.ViewModel
          import com.contoh.videoeditor.model.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update

          enum class BottomMenuTab { MAIN, EDIT_CLIP, AUDIO, TEXT, EFFECTS, AI_TOOLS }

          data class EditorUiState(
              val project: ProEditProject = ProEditProject(),
              val currentPlayheadMs: Long = 0L,
              val totalDurationMs: Long = 15000L,
              val isPlaying: Boolean = false,
              val selectedClipIndex: Int? = null,
              val activeTab: BottomMenuTab = BottomMenuTab.MAIN,
              val isExporting: Boolean = false
          )

          class EditorViewModel : ViewModel() {

              private val _uiState = MutableStateFlow(EditorUiState())
              val uiState: StateFlow<EditorUiState> = _uiState.asStateFlow()

              private val undoStack = ArrayDeque<ProEditProject>()
              private val redoStack = ArrayDeque<ProEditProject>()

              private fun saveStateForUndo() {
                  undoStack.addLast(_uiState.value.project)
                  if (undoStack.size > 30) undoStack.removeFirst()
                  redoStack.clear()
              }

              fun addVideoClips(uris: List<Uri>) {
                  if (uris.isEmpty()) return
                  saveStateForUndo()
                  val newClips = uris.map { VideoClipItem(uri = it) }
                  _uiState.update {
                      it.copy(
                          project = it.project.copy(mainClips = it.project.mainClips + newClips),
                          selectedClipIndex = it.project.mainClips.size
                      )
                  }
              }

              fun addAudioTrack(uri: Uri) {
                  saveStateForUndo()
                  val newAudio = AudioTrackItem(uri = uri, volume = 0.2f)
                  _uiState.update {
                      it.copy(project = it.project.copy(audioTracks = it.project.audioTracks + newAudio))
                  }
              }

              fun undo() {
                  if (undoStack.isEmpty()) return
                  redoStack.addLast(_uiState.value.project)
                  _uiState.update { it.copy(project = undoStack.removeLast()) }
              }

              fun redo() {
                  if (redoStack.isEmpty()) return
                  undoStack.addLast(_uiState.value.project)
                  _uiState.update { it.copy(project = redoStack.removeLast()) }
              }

              fun updatePlayhead(ms: Long) {
                  _uiState.update { it.copy(currentPlayheadMs = ms.coerceIn(0L, it.totalDurationMs)) }
              }

              fun togglePlayPause() {
                  _uiState.update { it.copy(isPlaying = !it.isPlaying) }
              }

              fun selectClip(index: Int?) {
                  _uiState.update {
                      it.copy(
                          selectedClipIndex = index,
                          activeTab = if (index != null) BottomMenuTab.EDIT_CLIP else BottomMenuTab.MAIN
                      )
                  }
              }

              fun setBottomTab(tab: BottomMenuTab) {
                  _uiState.update { it.copy(activeTab = tab) }
              }

              fun setExporting(exporting: Boolean) {
                  _uiState.update { it.copy(isExporting = exporting) }
              }

              fun splitSelectedClipAtPlayhead() {
                  val state = _uiState.value
                  val index = state.selectedClipIndex ?: return
                  val clip = state.project.mainClips.getOrNull(index) ?: return
                  val splitPoint = state.currentPlayheadMs

                  if (splitPoint <= clip.startMs + 200L || splitPoint >= clip.endMs - 200L) return

                  saveStateForUndo()
                  val firstHalf = clip.copy(endMs = splitPoint)
                  val secondHalf = clip.copy(startMs = splitPoint)

                  val updatedClips = state.project.mainClips.toMutableList().apply {
                      removeAt(index)
                      add(index, firstHalf)
                      add(index + 1, secondHalf)
                  }
                  _uiState.update { it.copy(project = it.project.copy(mainClips = updatedClips)) }
              }

              fun updateClipSpeed(newSpeed: Float) {
                  val index = _uiState.value.selectedClipIndex ?: return
                  saveStateForUndo()
                  val updatedClips = _uiState.value.project.mainClips.mapIndexed { i, clip ->
                      if (i == index) clip.copy(speed = newSpeed) else clip
                  }
                  _uiState.update { it.copy(project = it.project.copy(mainClips = updatedClips)) }
              }

              fun applyFilter(filter: VideoFilter) {
                  val index = _uiState.value.selectedClipIndex ?: return
                  saveStateForUndo()
                  val updatedClips = _uiState.value.project.mainClips.mapIndexed { i, clip ->
                      if (i == index) clip.copy(filter = filter) else clip
                  }
                  _uiState.update { it.copy(project = it.project.copy(mainClips = updatedClips)) }
              }

              fun addTextAtPlayhead(text: String, colorInt: Int, animation: TextAnimation = TextAnimation.POP) {
                  saveStateForUndo()
                  val start = _uiState.value.currentPlayheadMs
                  val newText = ProTextItem(
                      text = text,
                      startMs = start,
                      endMs = start + 3000L,
                      textColor = colorInt,
                      animation = animation
                  )
                  _uiState.update {
                      it.copy(project = it.project.copy(textsAndCaptions = it.project.textsAndCaptions + newText))
                  }
              }
          }
          EOF

          # 12. CapCutEditorScreen.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/ui/CapCutEditorScreen.kt
          package com.contoh.videoeditor.ui

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.contoh.videoeditor.model.ProTextItem
          import com.contoh.videoeditor.model.VideoFilter
          import com.contoh.videoeditor.viewmodel.BottomMenuTab
          import com.contoh.videoeditor.viewmodel.EditorUiState
          import com.contoh.videoeditor.viewmodel.EditorViewModel

          @Composable
          fun CapCutEditorScreen(
              viewModel: EditorViewModel,
              onPickVideos: () -> Unit,
              onPickAudio: () -> Unit,
              onExportClick: () -> Unit
          ) {
              val state by viewModel.uiState.collectAsState()

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0E0E10))
              ) {
                  // TOP BAR
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onPickVideos) {
                              Icon(Icons.Default.AddPhotoAlternate, contentDescription = "Tambah Video", tint = Color.White)
                          }
                          Text("Adam Cut", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                      }

                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Surface(color = Color(0xFF222226), shape = RoundedCornerShape(6.dp)) {
                              Text(
                                  text = "1080P • 30fps • 9:16",
                                  color = Color.LightGray,
                                  fontSize = 11.sp,
                                  modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)
                              )
                          }

                          Button(
                              onClick = onExportClick,
                              enabled = !state.isExporting,
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF)),
                              contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text(
                                  text = if (state.isExporting) "Rendering..." else "Export",
                                  color = Color.Black,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 13.sp
                              )
                          }
                      }
                  }

                  // LIVE PREVIEW CANVAS 9:16
                  Box(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(vertical = 4.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Box(
                          modifier = Modifier
                              .aspectRatio(9f / 16f)
                              .fillMaxHeight()
                              .clip(RoundedCornerShape(8.dp))
                              .background(Color.Black),
                          contentAlignment = Alignment.Center
                      ) {
                          if (state.project.mainClips.isEmpty()) {
                              Text("Ketuk + untuk pilih video", color = Color.Gray, fontSize = 13.sp)
                          } else {
                              Text(
                                  text = "${state.project.mainClips.size} Klip Siap Diedit",
                                  color = Color(0xFF00E5FF),
                                  fontSize = 14.sp
                              )
                          }

                          val activeTexts = state.project.textsAndCaptions.filter {
                              state.currentPlayheadMs in it.startMs..it.endMs
                          }
                          activeTexts.forEach { caption: ProTextItem ->
                              Text(
                                  text = caption.text,
                                  color = Color(caption.textColor),
                                  fontSize = 22.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  modifier = Modifier
                                      .align(Alignment.BottomCenter)
                                      .padding(bottom = 48.dp)
                                      .background(Color(0x88000000), RoundedCornerShape(6.dp))
                                      .padding(horizontal = 10.dp, vertical = 4.dp)
                              )
                          }
                      }
                  }

                  // PLAYBACK BAR
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(
                          text = "${formatMs(state.currentPlayheadMs)} / ${formatMs(state.totalDurationMs)}",
                          color = Color.LightGray,
                          fontSize = 12.sp
                      )

                      IconButton(onClick = { viewModel.togglePlayPause() }) {
                          Icon(
                              imageVector = if (state.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                              contentDescription = "Play/Pause",
                              tint = Color.White,
                              modifier = Modifier.size(28.dp)
                          )
                      }

                      Row {
                          IconButton(onClick = { viewModel.undo() }) {
                              Icon(Icons.Default.Undo, contentDescription = "Undo", tint = Color.White)
                          }
                          IconButton(onClick = { viewModel.redo() }) {
                              Icon(Icons.Default.Redo, contentDescription = "Redo", tint = Color.White)
                          }
                      }
                  }

                  // MULTI-TRACK TIMELINE
                  CapCutTimelineArea(
                      state = state,
                      onAddVideoClick = onPickVideos,
                      onSelectClip = { viewModel.selectClip(it) },
                      onScrub = { viewModel.updatePlayhead(it) }
                  )

                  // BOTTOM TOOLBAR KONTEKSTUAL
                  CapCutBottomToolbar(
                      activeTab = state.activeTab,
                      onTabSelected = { viewModel.setBottomTab(it) },
                      onSplitClick = { viewModel.splitSelectedClipAtPlayhead() },
                      onSpeedClick = { viewModel.updateClipSpeed(1.5f) },
                      onAddTextClick = { viewModel.addTextAtPlayhead("KAMU BUKAN BAIK", android.graphics.Color.YELLOW) },
                      onPickAudioClick = onPickAudio,
                      onApplyCinematic = { viewModel.applyFilter(VideoFilter.CINEMATIC) }
                  )
              }
          }

          @Composable
          private fun CapCutTimelineArea(
              state: EditorUiState,
              onAddVideoClick: () -> Unit,
              onSelectClip: (Int) -> Unit,
              onScrub: (Long) -> Unit
          ) {
              val scrollState = rememberScrollState()

              LaunchedEffect(scrollState.value) {
                  onScrub((scrollState.value * 15L).coerceAtMost(state.totalDurationMs))
              }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(170.dp)
                      .background(Color(0xFF16161A))
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .horizontalScroll(scrollState)
                          .padding(horizontal = 180.dp, vertical = 14.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Row(horizontalArrangement = Arrangement.spacedBy(2.dp)) {
                          val clips = state.project.mainClips
                          if (clips.isEmpty()) {
                              Box(
                                  modifier = Modifier
                                      .width(240.dp)
                                      .height(48.dp)
                                      .clip(RoundedCornerShape(6.dp))
                                      .background(Color(0xFF2C2C34))
                                      .clickable { onAddVideoClick() },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text("+ Tambah Video", color = Color.White, fontSize = 12.sp)
                              }
                          } else {
                              clips.forEachIndexed { index, _ ->
                                  val isSelected = state.selectedClipIndex == index
                                  Box(
                                      modifier = Modifier
                                          .width(120.dp)
                                          .height(48.dp)
                                          .clip(RoundedCornerShape(6.dp))
                                          .background(Color(0xFF2B5B84))
                                          .border(
                                              width = if (isSelected) 2.dp else 0.dp,
                                              color = if (isSelected) Color.White else Color.Transparent,
                                              shape = RoundedCornerShape(6.dp)
                                          )
                                          .clickable { onSelectClip(index) },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text("Klip ${index + 1}", color = Color.White, fontSize = 11.sp)
                                  }
                              }
                          }
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          state.project.textsAndCaptions.forEach { caption ->
                              Box(
                                  modifier = Modifier
                                      .width(100.dp)
                                      .height(26.dp)
                                      .clip(RoundedCornerShape(4.dp))
                                      .background(Color(0xFFD97706)),
                                  contentAlignment = Alignment.CenterStart
                              ) {
                                  Text(
                                      text = caption.text,
                                      color = Color.White,
                                      fontSize = 10.sp,
                                      maxLines = 1,
                                      modifier = Modifier.padding(horizontal = 6.dp)
                                  )
                              }
                          }
                      }

                      Box(
                          modifier = Modifier
                              .width(240.dp)
                              .height(26.dp)
                              .clip(RoundedCornerShape(4.dp))
                              .background(Color(0xFF0E7490)),
                          contentAlignment = Alignment.CenterStart
                      ) {
                          Text(
                              text = "Audio (${state.project.audioTracks.size} track)",
                              color = Color.White,
                              fontSize = 10.sp,
                              modifier = Modifier.padding(start = 8.dp)
                          )
                      }
                  }

                  Box(
                      modifier = Modifier
                          .align(Alignment.Center)
                          .width(2.dp)
                          .fillMaxHeight()
                          .background(Color.White)
                  )
              }
          }

          @Composable
          private fun CapCutBottomToolbar(
              activeTab: BottomMenuTab,
              onTabSelected: (BottomMenuTab) -> Unit,
              onSplitClick: () -> Unit,
              onSpeedClick: () -> Unit,
              onAddTextClick: () -> Unit,
              onPickAudioClick: () -> Unit,
              onApplyCinematic: () -> Unit
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(72.dp)
                      .background(Color(0xFF0E0E10))
                      .horizontalScroll(rememberScrollState())
                      .padding(horizontal = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(20.dp)
              ) {
                  when (activeTab) {
                      BottomMenuTab.MAIN -> {
                          ToolbarAction(Icons.Default.ContentCut, "Edit") { onTabSelected(BottomMenuTab.EDIT_CLIP) }
                          ToolbarAction(Icons.Default.MusicNote, "Audio") { onTabSelected(BottomMenuTab.AUDIO) }
                          ToolbarAction(Icons.Default.Title, "Teks") { onTabSelected(BottomMenuTab.TEXT) }
                          ToolbarAction(Icons.Default.AutoAwesome, "Efek") { onTabSelected(BottomMenuTab.EFFECTS) }
                          ToolbarAction(Icons.Default.Layers, "Overlay") {}
                          ToolbarAction(Icons.Default.SmartToy, "AI Tools") { onTabSelected(BottomMenuTab.AI_TOOLS) }
                      }
                      BottomMenuTab.EDIT_CLIP -> {
                          ToolbarAction(Icons.Default.ArrowBack, "Kembali") { onTabSelected(BottomMenuTab.MAIN) }
                          ToolbarAction(Icons.Default.ContentCut, "Split", onSplitClick)
                          ToolbarAction(Icons.Default.Speed, "Speed 1.5x", onSpeedClick)
                          ToolbarAction(Icons.Default.Animation, "Keyframe") {}
                          ToolbarAction(Icons.Default.Face, "Mask") {}
                          ToolbarAction(Icons.Default.PauseCircle, "Freeze") {}
                          ToolbarAction(Icons.Default.Replay, "Reverse") {}
                      }
                      BottomMenuTab.TEXT -> {
                          ToolbarAction(Icons.Default.ArrowBack, "Kembali") { onTabSelected(BottomMenuTab.MAIN) }
                          ToolbarAction(Icons.Default.Add, "Add Text", onAddTextClick)
                          ToolbarAction(Icons.Default.Subtitles, "Auto Captions") {}
                          ToolbarAction(Icons.Default.Translate, "Translate") {}
                          ToolbarAction(Icons.Default.FontDownload, "Font") {}
                          ToolbarAction(Icons.Default.EmojiEmotions, "Sticker") {}
                      }
                      BottomMenuTab.AUDIO -> {
                          ToolbarAction(Icons.Default.ArrowBack, "Kembali") { onTabSelected(BottomMenuTab.MAIN) }
                          ToolbarAction(Icons.Default.LibraryMusic, "Sounds", onPickAudioClick)
                          ToolbarAction(Icons.Default.RecordVoiceOver, "TTS") {}
                          ToolbarAction(Icons.Default.Mic, "Voiceover") {}
                          ToolbarAction(Icons.Default.GraphicEq, "Beat Sync") {}
                          ToolbarAction(Icons.Default.NoiseAware, "Noise Red.") {}
                          ToolbarAction(Icons.Default.VolumeUp, "Volume") {}
                      }
                      BottomMenuTab.EFFECTS -> {
                          ToolbarAction(Icons.Default.ArrowBack, "Kembali") { onTabSelected(BottomMenuTab.MAIN) }
                          ToolbarAction(Icons.Default.Bolt, "Glitch/Shake") {}
                          ToolbarAction(Icons.Default.FilterVintage, "Cinematic", onApplyCinematic)
                          ToolbarAction(Icons.Default.Tune, "Adjust") {}
                          ToolbarAction(Icons.Default.CompareArrows, "Transition") {}
                      }
                      BottomMenuTab.AI_TOOLS -> {
                          ToolbarAction(Icons.Default.ArrowBack, "Kembali") { onTabSelected(BottomMenuTab.MAIN) }
                          ToolbarAction(Icons.Default.ContentCut, "Auto Cutout") {}
                          ToolbarAction(Icons.Default.Description, "Script to Vid") {}
                          ToolbarAction(Icons.Default.AutoFixHigh, "Enhance") {}
                      }
                  }
              }
          }

          @Composable
          private fun ToolbarAction(icon: ImageVector, label: String, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clickable(onClick = onClick)
              ) {
                  Icon(icon, contentDescription = label, tint = Color.White, modifier = Modifier.size(24.dp))
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(label, color = Color.LightGray, fontSize = 11.sp)
              }
          }

          private fun formatMs(ms: Long): String {
              val totalSec = ms / 1000
              val min = totalSec / 60
              val sec = totalSec % 60
              return "%02d:%02d".format(min, sec)
          }
          EOF

          # 13. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/contoh/videoeditor/MainActivity.kt
          package com.contoh.videoeditor

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.viewModels
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import com.contoh.videoeditor.engine.VideoEditorEngine
          import com.contoh.videoeditor.ui.CapCutEditorScreen
          import com.contoh.videoeditor.viewmodel.EditorViewModel

          class MainActivity : ComponentActivity() {

              private val editorViewModel: EditorViewModel by viewModels()
              private lateinit var editorEngine: VideoEditorEngine

              private val pickVideosLauncher = registerForActivityResult(
                  ActivityResultContracts.GetMultipleContents()
              ) { uris ->
                  if (uris.isNotEmpty()) {
                      editorViewModel.addVideoClips(uris)
                      Toast.makeText(this, "${uris.size} video ditambahkan", Toast.LENGTH_SHORT).show()
                  }
              }

              private val pickAudioLauncher = registerForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri ->
                  uri?.let {
                      editorViewModel.addAudioTrack(it)
                      Toast.makeText(this, "Audio ditambahkan", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  editorEngine = VideoEditorEngine(this)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          CapCutEditorScreen(
                              viewModel = editorViewModel,
                              onPickVideos = { pickVideosLauncher.launch("video/*") },
                              onPickAudio = { pickAudioLauncher.launch("audio/*") },
                              onExportClick = {
                                  val project = editorViewModel.uiState.value.project
                                  editorViewModel.setExporting(true)
                                  Toast.makeText(this, "Memulai render 1080p 30fps (9:16)...", Toast.LENGTH_SHORT).show()

                                  editorEngine.exportProject(
                                      project = project,
                                      onSuccess = {
                                          editorViewModel.setExporting(false)
                                          Toast.makeText(this, "Video berhasil disimpan ke Galeri/Movies/AdamCut!", Toast.LENGTH_LONG).show()
                                      },
                                      onError = { err ->
                                          editorViewModel.setExporting(false)
                                          Toast.makeText(this, "Gagal: ${err.message}", Toast.LENGTH_LONG).show()
                                      }
                                  )
                              }
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Adam-Cut.apk

      - name: Upload Adam Cut APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Adam-Cut-APK
          path: Adam-Cut.apk
          if-no-files-found: error
